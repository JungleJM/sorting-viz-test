<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sorting Visualization</title>
</head>
<body>
    <div id="sorting-visualization"></div>
    <button id="start-sort">Start Sort</button>
    <select id="algorithm-select">
        <option value="bubble-sort" data-bubble-sort>Bubble Sort</option>
        <option value="quick-sort" data-quick-sort>Quick Sort</option>
        <option value="merge-sort" data-merge-sort>Merge Sort</option>
    </select>
</body>
</html>
