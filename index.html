<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorting Visualization</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      text-align: center;
    }
    h1 {
      color: #bb86fc;
      margin-bottom: 30px;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    button {
      background-color: #424242;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #5c5c5c;
    }
    .active {
      background-color: #bb86fc !important;
    }
    .slider-container {
      margin: 15px 0;
      text-align: left;
    }
    .slider-label {
      display: block;
      margin-bottom: 5px;
      color: #bb86fc;
    }
    input[type="range"] {
      width: 200px;
      -webkit-appearance: none;
      background: #424242;
      border-radius: 5px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: #bb86fc;
      border-radius: 50%;
      cursor: pointer;
    }
    .array-container {
      margin-top: 30px;
      position: relative;
      min-height: 400px;
      border: 1px solid #424242;
      padding: 20px;
      background-color: #1e1e1e;
    }
    .bar {
      display: inline-block;
      margin-right: 2px;
      transition: height 0.5s ease, background-color 0.3s ease;
    }
    .stats {
      margin-top: 20px;
      font-size: 14px;
      color: #9e9e9e;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Sorting Algorithm Visualization</h1>

    <div class="controls">
      <button id="bubble-btn">Bubble Sort</button>
      <button id="insertion-btn">Insertion Sort</button>
      <button id="selection-btn">Selection Sort</button>
      <button id="merge-btn">Merge Sort</button>
      <button id="quick-btn">Quick Sort</button>
      <button id="heap-btn">Heap Sort</button>

      <div class="slider-container">
        <label for="speed-slider" class="slider-label">Speed:</label>
        <input type="range" id="speed-slider" min="1" max="10" value="5">
      </div>

      <div class="slider-container">
        <label for="size-slider" class="slider-label">Array Size:</label>
        <input type="range" id="size-slider" min="10" max="200" value="50">
      </div>

      <button id="shuffle-btn">Shuffle</button>
      <button id="reset-btn">Reset</button>
      <button id="start-pause-btn">Start</button>
    </div>

    <div class="array-container" id="array-container">
      <!-- Bars will be rendered here -->
    </div>

    <div class="stats">
      <p>Array Size: <span id="current-size">50</span></p>
      <p>Speed: <span id="current-speed">5</span></p>
      <p>Operations: <span id="operations-count">0</span></p>
      <p>Comparisons: <span id="comparisons-count">0</span></p>
    </div>
  </div>

  <script>
    // Configuration
    const DEFAULT_SIZE = 50;
    const MIN_SIZE = 10;
    const MAX_SIZE = 200;
    const DEFAULT_SPEED = 5;
    const MIN_SPEED = 1;
    const MAX_SPEED = 10;

    // State variables
    let arraySize = DEFAULT_SIZE;
    let currentSpeed = DEFAULT_SPEED;
    let arrayValues = [];
    let isSorting = false;
    let sortingInterval = null;
    let selectedAlgorithm = null;
    let operationsCount = 0;
    let comparisonsCount = 0;

    // DOM elements
    const arrayContainer = document.getElementById('array-container');
    const sizeSlider = document.getElementById('size-slider');
    const speedSlider = document.getElementById('speed-slider');
    const shuffleBtn = document.getElementById('shuffle-btn');
    const resetBtn = document.getElementById('reset-btn');
    const startPauseBtn = document.getElementById('start-pause-btn');
    const currentSizeDisplay = document.getElementById('current-size');
    const currentSpeedDisplay = document.getElementById('current-speed');
    const operationsCountDisplay = document.getElementById('operations-count');
    const comparisonsCountDisplay = document.getElementById('comparisons-count');

    // Algorithm buttons
    const bubbleBtn = document.getElementById('bubble-btn');
    const insertionBtn = document.getElementById('insertion-btn');
    const selectionBtn = document.getElementById('selection-btn');
    const mergeBtn = document.getElementById('merge-btn');
    const quickBtn = document.getElementById('quick-btn');
    const heapBtn = document.getElementById('heap-btn');

    // Initialize
    function init() {
      generateArray();
      renderBars();

      // Event listeners
      sizeSlider.addEventListener('input', updateSize);
      speedSlider.addEventListener('input', updateSpeed);

      shuffleBtn.addEventListener('click', () => {
        if (!isSorting) {
          generateArray();
          renderBars();
        }
      });

      resetBtn.addEventListener('click', () => {
        if (sortingInterval) {
          clearInterval(sortingInterval);
          sortingInterval = null;
        }
        isSorting = false;
        startPauseBtn.textContent = 'Start';
        selectedAlgorithm = null;

        // Reset all button styles
        document.querySelectorAll('.controls button').forEach(btn => {
          btn.classList.remove('active');
        });

        generateArray();
        renderBars();
      });

      startPauseBtn.addEventListener('click', () => {
        if (isSorting) {
          clearInterval(sortingInterval);
          sortingInterval = null;
          isSorting = false;
          startPauseBtn.textContent = 'Start';
        } else if (selectedAlgorithm) {
          isSorting = true;
          startPauseBtn.textContent = 'Pause';
          runSortingAlgorithm();
        }
      });

      // Algorithm button event listeners
      bubbleBtn.addEventListener('click', () => selectAlgorithm('bubble'));
      insertionBtn.addEventListener('click', () => selectAlgorithm('insertion'));
      selectionBtn.addEventListener('click', () => selectAlgorithm('selection'));
      mergeBtn.addEventListener('click', () => selectAlgorithm('merge'));
      quickBtn.addEventListener('click', () => selectAlgorithm('quick'));
      heapBtn.addEventListener('click', () => selectAlgorithm('heap'));
    }

    // Generate random array values
    function generateArray() {
      arrayValues = [];
      for (let i = 0; i < arraySize; i++) {
        arrayValues.push(Math.floor(Math.random() * 500) + 1);
      }
    }

    // Render bars based on current array values
    function renderBars() {
      arrayContainer.innerHTML = '';

      const maxValue = Math.max(...arrayValues);
      const barWidth = Math.max(2, Math.min(8, 600 / arraySize));

      arrayValues.forEach((value, index) => {
        const barHeight = (value / maxValue) * 400;
        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.height = `${barHeight}px`;
        bar.style.width = `${barWidth}px`;
        bar.style.backgroundColor = '#bb86fc';
        arrayContainer.appendChild(bar);
      });
    }

    // Update array size
    function updateSize() {
      arraySize = parseInt(sizeSlider.value);
      currentSizeDisplay.textContent = arraySize;

      if (!isSorting) {
        generateArray();
        renderBars();
      }
    }

    // Update speed setting
    function updateSpeed() {
      currentSpeed = parseInt(speedSlider.value);
      currentSpeedDisplay.textContent = currentSpeed;
    }

    // Select sorting algorithm
    function selectAlgorithm(algorithm) {
      selectedAlgorithm = algorithm;

      // Remove active class from all buttons
      document.querySelectorAll('.controls button').forEach(btn => {
        btn.classList.remove('active');
      });

      // Add active class to selected button
      event.target.classList.add('active');

      if (isSorting) {
        clearInterval(sortingInterval);
        sortingInterval = null;
        isSorting = false;
        startPauseBtn.textContent = 'Start';
      }
    }

    // Run the selected sorting algorithm
    function runSortingAlgorithm() {
      const delay = 100 - (currentSpeed * 8); // Convert speed to delay

      switch (selectedAlgorithm) {
        case 'bubble':
          bubbleSortStepByStep();
          break;
        case 'insertion':
          insertionSortStepByStep();
          break;
        case 'selection':
          selectionSortStepByStep();
          break;
        case 'merge':
          mergeSortStepByStep();
          break;
        case 'quick':
          quickSortStepByStep();
          break;
        case 'heap':
          heapSortStepByStep();
          break;
      }

      sortingInterval = setInterval(() => {
        if (isArraySorted()) {
          clearInterval(sortingInterval);
          sortingInterval = null;
          isSorting = false;
          startPauseBtn.textContent = 'Start';
        }
      }, delay);
    }

    // Bubble Sort implementation
    function bubbleSortStepByStep() {
      let i = 0;
      const maxIterations = arraySize - 1;

      const interval = setInterval(() => {
        if (i >= maxIterations) {
          clearInterval(interval);
          return;
        }

        for (let j = 0; j < maxIterations - i; j++) {
          comparisonsCount++;
          if (arrayValues[j] > arrayValues[j + 1]) {
            // Swap elements
            [arrayValues[j], arrayValues[j + 1]] = [arrayValues[j + 1], arrayValues[j]];
            operationsCount++;

            // Highlight the swapped bars
            highlightBars(j, j + 1);
          }
        }

        i++;
      }, 50 - (currentSpeed * 3));
    }

    // Insertion Sort implementation
    function insertionSortStepByStep() {
      let i = 1;
      const maxIterations = arraySize;

      const interval = setInterval(() => {
        if (i >= maxIterations) {
          clearInterval(interval);
          return;
        }

        for (let j = i; j > 0; j--) {
          comparisonsCount++;
          if (arrayValues[j] < arrayValues[j - 1]) {
            // Swap elements
            [arrayValues[j], arrayValues[j - 1]] = [arrayValues[j - 1], arrayValues[j]];
            operationsCount++;

            // Highlight the swapped bars
            highlightBars(j, j - 1);
          } else {
            break;
          }
        }

        i++;
      }, 50 - (currentSpeed * 3));
    }

    // Selection Sort implementation
    function selectionSortStepByStep() {
      let i = 0;
      const maxIterations = arraySize;

      const interval = setInterval(() => {
        if (i >= maxIterations) {
          clearInterval(interval);
          return;
        }

        let minIndex = i;
