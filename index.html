<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorting Visualization Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { display: flex; gap: 20px; }
        .visualization { width: 70%; border: 1px solid #ccc; padding: 10px; }
        .controls { width: 30%; }
        button { margin: 5px 0; padding: 8px 12px; cursor: pointer; }
        .bar { display: inline-block; width: 20px; height: 50px; background-color: steelblue; margin: 0 2px; }
    </style>
</head>
<body>
    <h1>Sorting Visualization Test</h1>
    <div class="container">
        <div class="visualization" id="viz"></div>
        <div class="controls">
            <button onclick="runBubbleSort()">Run Bubble Sort</button>
            <button onclick="runInsertionSort()">Run Insertion Sort</button>
            <button onclick="runSelectionSort()">Run Selection Sort</button>
            <div id="stats">
                Comparisons: <span id="comparisons">0</span><br>
                Swaps/Writes: <span id="swaps">0</span>
            </div>
        </div>
    </div>

    <script>
        let data = [5, 3, 8, 4, 2];
        let comparisons = 0;
        let swaps = 0;

        function renderBars() {
            const viz = document.getElementById('viz');
            viz.innerHTML = '';
            data.forEach(value => {
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.height = `${value * 10}px`;
                bar.textContent = value;
                viz.appendChild(bar);
            });
        }

        function incrementComparisons() { comparisons++; document.getElementById('comparisons').textContent = comparisons; }
        function incrementSwaps() { swaps++; document.getElementById('swaps').textContent = swaps; }

        async function runBubbleSort() {
            resetStats();
            for (let i = 0; i < data.length - 1; i++) {
                for (let j = 0; j < data.length - i - 1; j++) {
                    incrementComparisons();
                    if (data[j] > data[j + 1]) {
                        [data[j], data[j + 1]] = [data[j + 1], data[j]];
                        incrementSwaps();
                    }
                    await new Promise(resolve => setTimeout(resolve, 500));
                    renderBars();
                }
            }
        }

        async function runInsertionSort() {
            resetStats();
            for (let i = 1; i < data.length; i++) {
                let j = i;
                while (j > 0 && data[j] < data[j - 1]) {
                    incrementComparisons();
                    [data[j], data[j - 1]] = [data[j - 1], data[j]];
                    incrementSwaps();
                    j--;
                    await new Promise(resolve => setTimeout(resolve, 500));
                    renderBars();
                }
            }
        }

        async function runSelectionSort() {
            resetStats();
            for (let i = 0; i < data.length - 1; i++) {
                let minIndex = i;
                for (let j = i + 1; j < data.length; j++) {
                    incrementComparisons();
                    if (data[j] < data[minIndex]) {
                        minIndex = j;
                    }
                }
                if (minIndex !== i) {
                    [data[i], data[minIndex]] = [data[minIndex], data[i]];
                    incrementSwaps();
                }
                await new Promise(resolve => setTimeout(resolve, 500));
                renderBars();
            }
        }

        function resetStats() { comparisons = 0; swaps = 0; document.getElementById('comparisons').textContent = '0'; document.getElementById('swaps').textContent = '0'; }

        window.onload = renderBars;
    </script>
</body>
</html>
