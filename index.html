<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorting Visualization Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .controls { margin-bottom: 20px; }
        button { padding: 8px 16px; margin-right: 10px; cursor: pointer; }
        #array-container { display: flex; align-items: center; gap: 5px; margin-bottom: 20px; }
        .bar { width: 30px; height: 50px; background-color: steelblue; display: inline-block; transition: all 0.1s; }
        .sorted { background-color: green !important; }
        #stats { margin-top: 20px; padding: 10px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>Sorting Visualization Test</h1>
    <div class="controls">
        <button onclick="startSort('bubbleSort')">Bubble Sort</button>
        <button onclick="startSort('selectionSort')">Selection Sort</button>
        <button onclick="resetArray()">Reset Array</button>
    </div>
    <div id="array-container"></div>
    <div id="stats">
        <p>Algorithm: <span id="algorithm-name">None</span></p>
        <p>Comparisons: <span id="comparisons">0</span></p>
        <p>Swaps/Writes: <span id="swaps-writes">0</span></p>
        <p>Elapsed Time: <span id="elapsed-time">0</span> ms</p>
    </div>

    <script>
        let array = [];
        let isSorting = false;
        let comparisons = 0;
        let swapsWrites = 0;
        let startTime = 0;
        let currentAlgorithm = '';

        function initializeArray() {
            array = Array.from({length: 20}, () => Math.floor(Math.random() * 100) + 1);
            renderArray();
        }

        function renderArray() {
            const container = document.getElementById('array-container');
            container.innerHTML = '';
            array.forEach(value => {
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.height = `${value * 2}px`;
                bar.textContent = value;
                container.appendChild(bar);
            });
        }

        function updateStats() {
            document.getElementById('algorithm-name').textContent = currentAlgorithm;
            document.getElementById('comparisons').textContent = comparisons;
            document.getElementById('swaps-writes').textContent = swapsWrites;
            const elapsedTime = Date.now() - startTime;
            document.getElementById('elapsed-time').textContent = elapsedTime;
        }

        function resetStats() {
            comparisons = 0;
            swapsWrites = 0;
            startTime = Date.now();
            updateStats();
        }

        async function bubbleSort() {
            isSorting = true;
            currentAlgorithm = 'Bubble Sort';
            resetStats();

            for (let i = 0; i < array.length - 1 && isSorting; i++) {
                for (let j = 0; j < array.length - i - 1 && isSorting; j++) {
                    comparisons++;
                    updateStats();
                    await new Promise(resolve => setTimeout(resolve, 50));
                    if (array[j] > array[j + 1]) {
                        [array[j], array[j + 1]] = [array[j + 1], array[j]];
                        swapsWrites++;
                        renderArray();
                        updateStats();
                    }
                }
            }

            markAllSorted();
            isSorting = false;
        }

        async function selectionSort() {
            isSorting = true;
            currentAlgorithm = 'Selection Sort';
            resetStats();

            for (let i = 0; i < array.length - 1 && isSorting; i++) {
                let minIndex = i;

                for (let j = i + 1; j < array.length && isSorting; j++) {
                    comparisons++;
                    updateStats();
                    await new Promise(resolve => setTimeout(resolve, 50));
                    if (array[j] < array[minIndex]) {
                        minIndex = j;
                    }
                }

                if (minIndex !== i) {
                    [array[i], array[minIndex]] = [array[minIndex], array[i]];
                    swapsWrites++;
                    renderArray();
                    updateStats();
                }
            }

            markAllSorted();
            isSorting = false;
        }

        function markAllSorted() {
            const bars = document.querySelectorAll('.bar');
            bars.forEach(bar => bar.classList.add('sorted'));
        }

        function startSort(algorithm) {
            if (isSorting) return;

            resetArray();
            if (algorithm === 'bubbleSort') bubbleSort();
            else selectionSort();
        }

        function resetArray() {
            isSorting = false;
            currentAlgorithm = '';
            comparisons = 0;
            swapsWrites = 0;
            updateStats();
            initializeArray();
        }

        window.onload = initializeArray;
    </script>
</body>
</html>
