<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sorting Visualizer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101417;
      --surface: #172027;
      --surface-2: #202b34;
      --line: #33424d;
      --text: #eef4f7;
      --muted: #a8b6bf;
      --accent: #4aa3ff;
      --accent-2: #47c28a;
      --bar: #7d8ea1;
      --compare: #ff6f61;
      --write: #ffd166;
      --sorted: #67e480;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    main {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 22px 0 28px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.55rem, 3vw, 2.35rem);
      letter-spacing: 0;
    }

    .subtle {
      color: var(--muted);
      line-height: 1.45;
    }

    .layout {
      display: grid;
      grid-template-columns: 310px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
    }

    .controls {
      display: grid;
      gap: 14px;
    }

    .section-title {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .algorithm-grid,
    .actions,
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      background: var(--surface-2);
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    button:hover { border-color: var(--accent); }
    button:disabled { cursor: not-allowed; opacity: 0.58; }
    button.active { background: #1d4d3a; border-color: var(--accent-2); }
    button.primary { background: #1d5e99; border-color: var(--accent); }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    input[type="range"] { width: 100%; }

    .stat {
      min-height: 64px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      background: var(--surface-2);
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .stat strong {
      display: block;
      margin-top: 4px;
      font-size: 1.1rem;
      overflow-wrap: anywhere;
    }

    .visual-panel {
      display: grid;
      gap: 12px;
    }

    #sorting-visualization {
      height: clamp(320px, 55vh, 560px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(180deg, #151d23, #11171c);
      padding: 10px;
      overflow: hidden;
    }

    #array-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: end;
      gap: 2px;
    }

    .bar {
      flex: 1 1 auto;
      min-width: 2px;
      border-radius: 4px 4px 0 0;
      background: var(--bar);
      transition: height 80ms linear, background-color 80ms linear;
    }

    .bar.comparing { background: var(--compare); }
    .bar.writing { background: var(--write); }
    .bar.sorted { background: var(--sorted); }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .key {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      background: var(--bar);
    }

    .swatch.compare { background: var(--compare); }
    .swatch.write { background: var(--write); }
    .swatch.done { background: var(--sorted); }

    @media (max-width: 780px) {
      main { width: min(100vw - 20px, 1180px); }
      header {
        flex-direction: column;
        align-items: start;
      }
      .layout { grid-template-columns: 1fr; }
    }

    @media (max-width: 460px) {
      .algorithm-grid,
      .actions,
      .stats-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Sorting Visualizer</h1>
        <div class="subtle">Watch how values are compared, moved, and locked into order.</div>
      </div>
      <div class="subtle" id="status-text">Ready</div>
    </header>

    <div class="layout">
      <aside class="panel controls">
        <section>
          <p class="section-title">Algorithm</p>
          <div class="algorithm-grid" id="algorithm-buttons">
            <button class="algorithm-btn active" id="bubble-btn" data-algorithm="bubble">Bubble Sort</button>
            <button class="algorithm-btn" id="insertion-btn" data-algorithm="insertion">Insertion Sort</button>
            <button class="algorithm-btn" id="selection-btn" data-algorithm="selection">Selection Sort</button>
            <button class="algorithm-btn" id="merge-btn" data-algorithm="merge">Merge Sort</button>
            <button class="algorithm-btn" id="quick-btn" data-algorithm="quick">Quick Sort</button>
            <button class="algorithm-btn" id="heap-btn" data-algorithm="heap">Heap Sort</button>
          </div>
        </section>

        <section>
          <p class="section-title">Controls</p>
          <label>
            Speed: <strong id="speed-value">60 ms</strong>
            <input id="speed-slider" type="range" min="10" max="350" value="60">
          </label>
          <label>
            Array size: <strong id="size-value">64</strong>
            <input id="size-slider" type="range" min="10" max="200" value="64">
          </label>
          <div class="actions">
            <button id="shuffle-btn">Shuffle & Reset</button>
            <button class="primary" id="start-pause-btn">Start</button>
          </div>
        </section>

        <section>
          <p class="section-title">Stats</p>
          <div class="stats-grid">
            <div class="stat"><span>Current algorithm</span><strong id="current-algorithm">Bubble Sort</strong></div>
            <div class="stat"><span>Comparisons</span><strong id="comparisons">0</strong></div>
            <div class="stat"><span>Swaps / writes</span><strong id="swaps">0</strong></div>
            <div class="stat"><span>Elapsed</span><strong id="time-elapsed">0.0s</strong></div>
          </div>
        </section>
      </aside>

      <section class="visual-panel">
        <div id="sorting-visualization" aria-label="Sorting bar visualization">
          <div id="array-container"></div>
        </div>
        <div class="legend">
          <span class="key"><span class="swatch"></span>Waiting</span>
          <span class="key"><span class="swatch compare"></span>Comparing</span>
          <span class="key"><span class="swatch write"></span>Moving</span>
          <span class="key"><span class="swatch done"></span>Sorted</span>
        </div>
      </section>
    </div>
  </main>

  <script>
    const algorithms = {
      bubble: { label: "Bubble Sort", factory: bubbleSort },
      insertion: { label: "Insertion Sort", factory: insertionSort },
      selection: { label: "Selection Sort", factory: selectionSort },
      merge: { label: "Merge Sort", factory: mergeSort },
      quick: { label: "Quick Sort", factory: quickSort },
      heap: { label: "Heap Sort", factory: heapSort }
    };

    const arrayContainer = document.getElementById("array-container");
    const algorithmButtons = Array.from(document.querySelectorAll(".algorithm-btn"));
    const speedSlider = document.getElementById("speed-slider");
    const speedValue = document.getElementById("speed-value");
    const sizeSlider = document.getElementById("size-slider");
    const sizeValue = document.getElementById("size-value");
    const shuffleBtn = document.getElementById("shuffle-btn");
    const startPauseBtn = document.getElementById("start-pause-btn");
    const currentAlgorithm = document.getElementById("current-algorithm");
    const comparisons = document.getElementById("comparisons");
    const swaps = document.getElementById("swaps");
    const timeElapsed = document.getElementById("time-elapsed");
    const statusText = document.getElementById("status-text");

    let values = [];
    let activeAlgorithm = "bubble";
    let activeStep = null;
    let isRunning = false;
    let isPaused = false;
    let animationTimer = 0;
    let startedAt = 0;
    let elapsedBeforePause = 0;
    let stats = { comparisons: 0, swaps: 0 };

    function generateArray(size = Number(sizeSlider.value)) {
      values = Array.from({ length: size }, () => Math.floor(Math.random() * 96) + 5);
      resetRunState();
      renderBars();
    }

    function renderBars(state = {}) {
      arrayContainer.innerHTML = "";
      const maxValue = Math.max(...values, 1);
      const comparing = new Set(state.comparing || []);
      const writing = new Set(state.writing || []);
      const sorted = new Set(state.sorted || []);

      values.forEach((value, index) => {
        const bar = document.createElement("div");
        bar.className = "bar";
        if (comparing.has(index)) bar.classList.add("comparing");
        if (writing.has(index)) bar.classList.add("writing");
        if (sorted.has(index)) bar.classList.add("sorted");
        bar.style.height = `${Math.max(3, (value / maxValue) * 100)}%`;
        bar.title = String(value);
        arrayContainer.appendChild(bar);
      });
    }

    function resetRunState() {
      clearTimeout(animationTimer);
      activeStep = null;
      isRunning = false;
      isPaused = false;
      elapsedBeforePause = 0;
      startedAt = 0;
      stats = { comparisons: 0, swaps: 0 };
      comparisons.textContent = "0";
      swaps.textContent = "0";
      timeElapsed.textContent = "0.0s";
      startPauseBtn.textContent = "Start";
      statusText.textContent = "Ready";
      currentAlgorithm.textContent = algorithms[activeAlgorithm].label;
    }

    function speedDelay() {
      return Number(speedSlider.value);
    }

    function startOrPause() {
      if (!isRunning) {
        activeStep = algorithms[activeAlgorithm].factory([...values]);
        isRunning = true;
        isPaused = false;
        startedAt = performance.now();
        startPauseBtn.textContent = "Pause";
        statusText.textContent = "Sorting";
        scheduleNextStep();
        return;
      }

      isPaused = !isPaused;
      if (isPaused) {
        clearTimeout(animationTimer);
        elapsedBeforePause += performance.now() - startedAt;
        startPauseBtn.textContent = "Resume";
        statusText.textContent = "Paused";
      } else {
        startedAt = performance.now();
        startPauseBtn.textContent = "Pause";
        statusText.textContent = "Sorting";
        scheduleNextStep();
      }
    }

    function scheduleNextStep() {
      if (!isRunning || isPaused) return;

      const result = activeStep.next();
      if (result.done) {
        finishRun();
        return;
      }

      const step = result.value;
      values = step.values;
      stats.comparisons += step.comparisons || 0;
      stats.swaps += step.swaps || 0;
      comparisons.textContent = String(stats.comparisons);
      swaps.textContent = String(stats.swaps);
      updateElapsed();
      renderBars(step);
      animationTimer = setTimeout(scheduleNextStep, speedDelay());
    }

    function updateElapsed() {
      const elapsed = elapsedBeforePause + (isRunning && !isPaused ? performance.now() - startedAt : 0);
      timeElapsed.textContent = `${(elapsed / 1000).toFixed(1)}s`;
    }

    function finishRun() {
      isRunning = false;
      isPaused = false;
      elapsedBeforePause += performance.now() - startedAt;
      startPauseBtn.textContent = "Start";
      statusText.textContent = "Complete";
      updateElapsed();
      renderBars({ sorted: values.map((_, index) => index) });
    }

    function selectAlgorithm(name) {
      activeAlgorithm = name;
      algorithmButtons.forEach((button) => {
        button.classList.toggle("active", button.dataset.algorithm === name);
      });
      resetRunState();
      renderBars();
    }

    function* bubbleSort(input) {
      const arr = [...input];
      for (let end = arr.length - 1; end > 0; end -= 1) {
        for (let i = 0; i < end; i += 1) {
          yield { values: [...arr], comparing: [i, i + 1], comparisons: 1 };
          if (arr[i] > arr[i + 1]) {
            [arr[i], arr[i + 1]] = [arr[i + 1], arr[i]];
            yield { values: [...arr], writing: [i, i + 1], swaps: 1 };
          }
        }
        yield { values: [...arr], sorted: range(end, arr.length) };
      }
      yield { values: [...arr], sorted: range(0, arr.length) };
    }

    function* insertionSort(input) {
      const arr = [...input];
      for (let i = 1; i < arr.length; i += 1) {
        const key = arr[i];
        let j = i - 1;
        while (j >= 0) {
          yield { values: [...arr], comparing: [j, j + 1], comparisons: 1 };
          if (arr[j] <= key) break;
          arr[j + 1] = arr[j];
          yield { values: [...arr], writing: [j, j + 1], swaps: 1 };
          j -= 1;
        }
        arr[j + 1] = key;
        yield { values: [...arr], writing: [j + 1], swaps: 1 };
      }
      yield { values: [...arr], sorted: range(0, arr.length) };
    }

    function* selectionSort(input) {
      const arr = [...input];
      for (let i = 0; i < arr.length - 1; i += 1) {
        let min = i;
        for (let j = i + 1; j < arr.length; j += 1) {
          yield { values: [...arr], comparing: [min, j], sorted: range(0, i), comparisons: 1 };
          if (arr[j] < arr[min]) min = j;
        }
        if (min !== i) {
          [arr[i], arr[min]] = [arr[min], arr[i]];
          yield { values: [...arr], writing: [i, min], sorted: range(0, i), swaps: 1 };
        }
      }
      yield { values: [...arr], sorted: range(0, arr.length) };
    }

    function* mergeSort(input) {
      const arr = [...input];
      for (let width = 1; width < arr.length; width *= 2) {
        for (let left = 0; left < arr.length; left += width * 2) {
          const middle = Math.min(left + width, arr.length);
          const right = Math.min(left + width * 2, arr.length);
          const merged = [];
          let i = left;
          let j = middle;
          while (i < middle && j < right) {
            yield { values: [...arr], comparing: [i, j], comparisons: 1 };
            if (arr[i] <= arr[j]) merged.push(arr[i++]);
            else merged.push(arr[j++]);
          }
          while (i < middle) merged.push(arr[i++]);
          while (j < right) merged.push(arr[j++]);
          for (let k = 0; k < merged.length; k += 1) {
            arr[left + k] = merged[k];
            yield { values: [...arr], writing: [left + k], swaps: 1 };
          }
        }
      }
      yield { values: [...arr], sorted: range(0, arr.length) };
    }

    function* quickSort(input) {
      const arr = [...input];
      const stack = [[0, arr.length - 1]];
      while (stack.length) {
        const [low, high] = stack.pop();
        if (low >= high) continue;
        const pivot = arr[high];
        let i = low;
        for (let j = low; j < high; j += 1) {
          yield { values: [...arr], comparing: [j, high], comparisons: 1 };
          if (arr[j] < pivot) {
            [arr[i], arr[j]] = [arr[j], arr[i]];
            yield { values: [...arr], writing: [i, j], swaps: 1 };
            i += 1;
          }
        }
        [arr[i], arr[high]] = [arr[high], arr[i]];
        yield { values: [...arr], writing: [i, high], swaps: 1 };
        stack.push([low, i - 1], [i + 1, high]);
      }
      yield { values: [...arr], sorted: range(0, arr.length) };
    }

    function* heapSort(input) {
      const arr = [...input];
      function* siftDown(start, end) {
        let root = start;
        while (root * 2 + 1 <= end) {
          let child = root * 2 + 1;
          let swap = root;
          yield { values: [...arr], comparing: [swap, child], comparisons: 1 };
          if (arr[swap] < arr[child]) swap = child;
          if (child + 1 <= end) {
            yield { values: [...arr], comparing: [swap, child + 1], comparisons: 1 };
            if (arr[swap] < arr[child + 1]) swap = child + 1;
          }
          if (swap === root) return;
          [arr[root], arr[swap]] = [arr[swap], arr[root]];
          yield { values: [...arr], writing: [root, swap], swaps: 1 };
          root = swap;
        }
      }

      for (let start = Math.floor((arr.length - 2) / 2); start >= 0; start -= 1) {
        yield* siftDown(start, arr.length - 1);
      }
      for (let end = arr.length - 1; end > 0; end -= 1) {
        [arr[end], arr[0]] = [arr[0], arr[end]];
        yield { values: [...arr], writing: [0, end], sorted: range(end, arr.length), swaps: 1 };
        yield* siftDown(0, end - 1);
      }
      yield { values: [...arr], sorted: range(0, arr.length) };
    }

    function range(start, end) {
      return Array.from({ length: Math.max(0, end - start) }, (_, index) => start + index);
    }

    algorithmButtons.forEach((button) => {
      button.addEventListener("click", () => selectAlgorithm(button.dataset.algorithm));
    });
    shuffleBtn.addEventListener("click", () => generateArray());
    startPauseBtn.addEventListener("click", startOrPause);
    speedSlider.addEventListener("input", () => {
      speedValue.textContent = `${speedDelay()} ms`;
    });
    sizeSlider.addEventListener("input", () => {
      sizeValue.textContent = sizeSlider.value;
      generateArray();
    });

    generateArray();
  </script>
</body>
</html>
