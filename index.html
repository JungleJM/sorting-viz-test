<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorting Visualization</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            padding: 8px 16px;
            cursor: pointer;
        }
        #speed-control {
            width: 150px;
        }
        #array-container {
            display: flex;
            gap: 5px;
            margin-top: 20px;
        }
        .bar {
            background-color: steelblue;
            transition: height 0.3s ease;
        }
        #elapsed-time {
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <h1>Sorting Visualization</h1>
    <div class="controls">
        <button id="start-btn">Start</button>
        <button id="pause-btn" disabled>Pause</button>
        <button id="resume-btn" disabled>Resume</button>
        <label for="speed-control">Speed:</label>
        <input type="range" id="speed-control" min="100" max="2000" value="500">
    </div>
    <div id="elapsed-time">Elapsed Time: 0s</div>
    <div id="array-container"></div>

    <script>
        let array = [];
        let isRunning = false;
        let isPaused = true;
        let currentStep = 0;
        let elapsedTime = 0;
        let animationId = null;
        let speed = 500;

        function initializeArray() {
            array = Array.from({length: 20}, () => Math.floor(Math.random() * 100) + 1);
            renderArray();
        }

        function renderArray() {
            const container = document.getElementById('array-container');
            container.innerHTML = '';
            array.forEach(value => {
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.height = `${value * 3}px`;
                bar.textContent = value;
                container.appendChild(bar);
            });
        }

        function startAnimation() {
            if (isRunning && !isPaused) return;

            isRunning = true;
            isPaused = false;
            currentStep = 0;
            elapsedTime = 0;
            document.getElementById('start-btn').disabled = true;
            document.getElementById('pause-btn').disabled = false;
            document.getElementById('resume-btn').disabled = true;

            animationId = setInterval(() => {
                if (!isPaused) {
                    // Simulate sorting step (bubble sort for visualization)
                    for (let i = 0; i < array.length - currentStep - 1; i++) {
                        if (array[i] > array[i + 1]) {
                            [array[i], array[i + 1]] = [array[i + 1], array[i]];
                        }
                    }
                    currentStep++;
                    renderArray();
                    elapsedTime += speed / 1000;
                    document.getElementById('elapsed-time').textContent = `Elapsed Time: ${elapsedTime.toFixed(2)}s`;

                    if (currentStep >= array.length) {
                        clearInterval(animationId);
                        isRunning = false;
                        isPaused = true;
                        document.getElementById('start-btn').disabled = false;
                        document.getElementById('pause-btn').disabled = true;
                    }
                }
            }, speed);
        }

        function pauseAnimation() {
            isPaused = true;
            document.getElementById('pause-btn').disabled = true;
            document.getElementById('resume-btn').disabled = false;
        }

        function resumeAnimation() {
            isPaused = false;
            document.getElementById('pause-btn').disabled = false;
            document.getElementById('resume-btn').disabled = true;
        }

        function updateSpeed() {
            speed = parseInt(document.getElementById('speed-control').value);
            if (isRunning && !isPaused) {
                clearInterval(animationId);
                startAnimation();
            }
        }

        document.getElementById('start-btn').addEventListener('click', startAnimation);
        document.getElementById('pause-btn').addEventListener('click', pauseAnimation);
        document.getElementById('resume-btn').addEventListener('click', resumeAnimation);
        document.getElementById('speed-control').addEventListener('input', updateSpeed);

        initializeArray();
    </script>
</body>
</html>
