<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorting Visualization</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }
        button {
            padding: 8px 16px;
            cursor: pointer;
        }
        input[type="range"] {
            width: 200px;
        }
        .array-container {
            display: flex;
            gap: 5px;
            margin-top: 20px;
        }
        .bar {
            height: 50px;
            width: 30px;
            background-color: steelblue;
        }
    </style>
</head>
<body>
    <h1>Sorting Visualization</h1>
    <div class="controls">
        <button id="startBtn">Start</button>
        <button id="pauseBtn" disabled>Pause</button>
        <button id="resumeBtn" disabled>Resume</button>
        <span id="elapsedTime">0s</span>
        <label for="speedSlider">Speed:</label>
        <input type="range" id="speedSlider" min="1" max="10" value="5">
    </div>
    <div class="array-container" id="arrayContainer"></div>

    <script>
        let array = [];
        let isRunning = false;
        let isPaused = true;
        let currentStep = 0;
        let elapsedTime = 0;
        let speed = 5;
        let animationId = null;

        function initializeArray() {
            array = Array.from({length: 20}, () => Math.floor(Math.random() * 100) + 1);
            renderArray();
        }

        function renderArray() {
            const container = document.getElementById('arrayContainer');
            container.innerHTML = '';
            array.forEach(value => {
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.height = `${value * 2}px`;
                container.appendChild(bar);
            });
        }

        function startAnimation() {
            if (isRunning && !isPaused) return;
            isRunning = true;
            isPaused = false;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('pauseBtn').disabled = false;

            animationId = setInterval(() => {
                if (!isPaused) {
                    // Simulate sorting step
                    currentStep++;
                    elapsedTime += 100; // Increment by 100ms

                    // Update elapsed time display
                    document.getElementById('elapsedTime').textContent =
                        `${(elapsedTime / 1000).toFixed(1)}s`;

                    // Simple bubble sort step for visualization
                    for (let i = 0; i < array.length - 1; i++) {
                        if (array[i] > array[i + 1]) {
                            [array[i], array[i + 1]] = [array[i + 1], array[i]];
                            renderArray();
                            break;
                        }
                    }

                    // Check if sorting is complete
                    if (isSorted()) {
                        clearInterval(animationId);
                        isRunning = false;
                        document.getElementById('startBtn').disabled = false;
                        document.getElementById('pauseBtn').disabled = true;
                        document.getElementById('resumeBtn').disabled = true;
                    }
                }
            }, 1000 / speed);
        }

        function pauseAnimation() {
            isPaused = true;
            document.getElementById('pauseBtn').disabled = true;
            document.getElementById('resumeBtn').disabled = false;
        }

        function resumeAnimation() {
            isPaused = false;
            document.getElementById('resumeBtn').disabled = true;
            document.getElementById('pauseBtn').disabled = false;
        }

        function updateSpeed() {
            speed = parseInt(document.getElementById('speedSlider').value);
            if (animationId) {
                clearInterval(animationId);
                startAnimation();
            }
        }

        function isSorted() {
            for (let i = 0; i < array.length - 1; i++) {
                if (array[i] > array[i + 1]) return false;
            }
            return true;
        }

        document.getElementById('startBtn').addEventListener('click', startAnimation);
        document.getElementById('pauseBtn').addEventListener('click', pauseAnimation);
        document.getElementById('resumeBtn').addEventListener('click', resumeAnimation);
        document.getElementById('speedSlider').addEventListener('input', updateSpeed);

        initializeArray();
    </script>
</body>
</html>
