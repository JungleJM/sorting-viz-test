<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorting Visualization</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button, input[type="range"] {
            background-color: #333;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #555;
        }
        .algorithm-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #sorting-visualization {
            width: 800px;
            height: 500px;
            border: 1px solid #444;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }
        .bar {
            position: absolute;
            background-color: #4a90e2;
            transition: height 0.3s, left 0.3s;
        }
        .stats-panel {
            margin-top: 20px;
            padding: 15px;
            background-color: #1e1e1e;
            border-radius: 8px;
            width: 80%;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Sorting Visualization</h1>

    <div class="algorithm-buttons">
        <button id="bubble-sort" data-algorithm="bubble">Bubble Sort</button>
        <button id="insertion-sort" data-algorithm="insertion">Insertion Sort</button>
        <button id="selection-sort" data-algorithm="selection">Selection Sort</button>
        <button id="merge-sort" data-algorithm="merge">Merge Sort</button>
        <button id="quick-sort" data-algorithm="quick">Quick Sort</button>
        <button id="heap-sort" data-algorithm="heap">Heap Sort</button>
    </div>

    <div class="controls">
        <div class="slider-container">
            <label for="speed-slider">Speed:</label>
            <input type="range" id="speed-slider" min="1" max="10" value="5">
        </div>
